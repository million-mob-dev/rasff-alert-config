name: 🔍 Auto-Update Filtros RASFF

# Corre automaticamente todas as segundas-feiras às 9h UTC
# e pode ser acionado manualmente no separador "Actions"
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-filters:
    name: Sincronizar Dicionários
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necessário para fazer commit das alterações

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: pip install requests

      - name: 🤖 Executar o motor de sincronização
        run: python scripts/update_filters.py

      - name: 💾 Commit & Push (se houver alterações)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rasff_filters_*.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "bot: 🔄 sincronização automática com a API RASFF" && git push)
